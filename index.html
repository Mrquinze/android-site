<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techie Apps</title>
<style>
  * { box-sizing: border-box; }
  html[data-theme="light"] {
    --bg:#F1F3F4; --surface:#FFFFFF; --surface-variant:#E8EAED;
    --primary:#1A73E8; --on-primary:#FFFFFF;
    --text:#202124; --text-secondary:#5F6368;
  }
  html[data-theme="dark"] {
    --bg:#131314; --surface:#1E1F20; --surface-variant:#2A2B2E;
    --primary:#A8C7FA; --on-primary:#062E6F;
    --text:#E3E3E3; --text-secondary:#9AA0A6;
  }
  body { margin:0; font-family:'Segoe UI', Roboto, system-ui, sans-serif;
    background:var(--bg); color:var(--text); transition:.3s; }
  .header { text-align:center; padding:44px 16px 16px; position:relative; }
  .theme-toggle { position:absolute; top:14px; right:16px; width:40px; height:40px;
    border-radius:50%; border:none; background:var(--surface); font-size:17px; cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .clock { font-size:54px; }
  .date { font-size:14px; color:var(--text-secondary); }
  .glance { display:inline-block; margin-top:12px; font-size:12px; color:var(--text-secondary);
    background:var(--surface); padding:7px 16px; border-radius:20px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:10px 16px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; padding:8px 14px; border-radius:20px; background:var(--surface-variant);
    font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .chip.active { background:var(--primary); color:var(--on-primary); }
  .grid-wrap { padding:0 16px 120px; }
  .count { font-size:11px; color:var(--text-secondary); margin:8px 4px; }
  .app-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:12px; }
  .app-card { background:var(--surface); border-radius:18px; padding:14px; display:flex; gap:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.07); }
  .app-icon { width:42px; height:42px; border-radius:12px; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; color:#fff; font-weight:700; }
  .name { font-size:14px; font-weight:600; }
  .cat { font-size:10px; font-weight:700; color:var(--primary); text-transform:uppercase; margin:2px 0 4px; }
  .desc { font-size:12px; color:var(--text-secondary); }
  .dock { position:fixed; bottom:0; left:0; right:0; padding:12px 16px 20px;
    background:linear-gradient(to top, var(--bg) 60%, transparent); }
  .search-bar { display:flex; align-items:center; gap:10px; background:var(--surface);
    border-radius:26px; padding:12px 18px; max-width:600px; margin:0 auto;
    box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .search-bar input { flex:1; border:none; background:transparent; outline:none; font-size:14px; color:var(--text); }
  .empty { text-align:center; color:var(--text-secondary); padding:30px; }
</style>
</head>
<body>

<div class="header">
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <div class="glance">60 apps curated for techies — no bloat</div>
</div>

<div class="chips" id="chips"></div>

<div class="grid-wrap">
  <div class="count"><span id="count">60</span> apps</div>
  <div class="app-grid" id="appGrid"></div>
</div>

<div class="dock">
  <div class="search-bar">
    🔍 <input id="search" placeholder="Search apps...">
  </div>
</div>

<script>
const palette = ["#4285F4","#EA4335","#FBBC05","#34A853","#673AB7","#009688","#FF7043","#3F51B5","#00ACC1","#8E24AA"];

const apps = [
  // Terminal & Shell
  {n:"Termux",c:"Terminal",d:"Full Linux terminal, no root needed"},
  {n:"JuiceSSH",c:"Terminal",d:"Polished SSH client with session manager"},
  {n:"Termius",c:"Terminal",d:"Cross platform SSH client with sync"},
  {n:"UserLAnd",c:"Terminal",d:"Run Linux distros without root"},
  {n:"ConnectBot",c:"Terminal",d:"Open source SSH and Telnet client"},
  {n:"Andronix",c:"Terminal",d:"Installs Linux distros in Termux"},

  // Development
  {n:"AIDE",c:"Development",d:"Full Android IDE, builds APKs on device"},
  {n:"Acode",c:"Development",d:"Fast open source code editor"},
  {n:"Pydroid 3",c:"Development",d:"Python 3 IDE with pip support"},
  {n:"Spck Editor",c:"Development",d:"Code editor with live preview and Git"},
  {n:"CxxDroid",c:"Development",d:"C/C++ compiler and IDE"},
  {n:"MGit",c:"Development",d:"Git client for repo management"},

  // Networking
  {n:"Fing",c:"Networking",d:"Network scanner and device discovery"},
  {n:"PingTools",c:"Networking",d:"Ping, traceroute and port scan toolkit"},
  {n:"WiFi Analyzer",c:"Networking",d:"Visualize Wi-Fi channels and signal"},
  {n:"Packet Capture",c:"Networking",d:"Capture and inspect network traffic"},
  {n:"Router Keygen",c:"Networking",d:"Recover default router passwords"},
  {n:"NetX",c:"Networking",d:"All in one network diagnostics suite"},

  // System Monitoring
  {n:"CPU-Z",c:"System",d:"Detailed hardware and SoC info"},
  {n:"AIDA64",c:"System",d:"In depth diagnostics and benchmarks"},
  {n:"Device Info HW",c:"System",d:"Hardware and sensor info reader"},
  {n:"GSam Battery Monitor",c:"System",d:"Per-app battery usage stats"},
  {n:"Sensor Box",c:"System",d:"Test every sensor your phone has"},
  {n:"Status",c:"System",d:"Customizable system status widget"},

  // File Management
  {n:"Solid Explorer",c:"Files",d:"Dual pane manager with cloud support"},
  {n:"Material Files",c:"Files",d:"Open source Material Design explorer"},
  {n:"MiXplorer",c:"Files",d:"Feature rich, archive and FTP support"},
  {n:"X-plore",c:"Files",d:"Dual pane with a built in server"},
  {n:"Total Commander",c:"Files",d:"Classic dual pane, plugin extensible"},
  {n:"Amaze File Manager",c:"Files",d:"Lightweight open source explorer"},

  // Automation
  {n:"Tasker",c:"Automation",d:"The ultimate automation engine"},
  {n:"MacroDroid",c:"Automation",d:"Beginner friendly automation macros"},
  {n:"Automate",c:"Automation",d:"Visual flowchart automation builder"},
  {n:"Button Mapper",c:"Automation",d:"Remap hardware buttons to actions"},
  {n:"Join",c:"Automation",d:"Sync and automate across devices"},
  {n:"AutoNotification",c:"Automation",d:"Tasker plugin for notification triggers"},

  // Privacy & Security
  {n:"NetGuard",c:"Privacy",d:"No root firewall for app control"},
  {n:"KeePassDX",c:"Privacy",d:"Offline password manager"},
  {n:"Aegis Authenticator",c:"Privacy",d:"Secure 2FA token manager"},
  {n:"Exodus Privacy",c:"Privacy",d:"Scan apps for hidden trackers"},
  {n:"Orbot",c:"Privacy",d:"Tor proxy for anonymous routing"},
  {n:"Bitwarden",c:"Privacy",d:"Open source password vault"},

  // VPN & Proxy
  {n:"WireGuard",c:"VPN",d:"Fast modern VPN protocol client"},
  {n:"OpenVPN Connect",c:"VPN",d:"Official OpenVPN client"},
  {n:"ProtonVPN",c:"VPN",d:"Privacy focused VPN service"},
  {n:"InviZible Pro",c:"VPN",d:"Combines Tor, I2P and DNSCrypt"},
  {n:"AFWall+",c:"VPN",d:"Root based iptables firewall"},
  {n:"Shadowsocks",c:"VPN",d:"Lightweight SOCKS5 secure proxy"},

  // Root Tools
  {n:"Magisk",c:"Root",d:"Systemless root and module manager"},
  {n:"Kernel Adiutor",c:"Root",d:"Tweak kernel parameters live"},
  {n:"Titanium Backup",c:"Root",d:"Full app and data backup with root"},
  {n:"SD Maid",c:"Root",d:"System cleaning and app control"},
  {n:"BusyBox",c:"Root",d:"Core Unix utilities for Android"},
  {n:"TWRP App",c:"Root",d:"Manage custom recovery in-app"},

  // Launchers & Widgets
  {n:"Nova Launcher",c:"Launcher",d:"Deeply customizable classic launcher"},
  {n:"Lawnchair",c:"Launcher",d:"Open source Pixel launcher alternative"},
  {n:"Niagara Launcher",c:"Launcher",d:"Minimalist single hand launcher"},
  {n:"KWGT",c:"Launcher",d:"Build fully custom home widgets"},
  {n:"KLWP",c:"Launcher",d:"Design animated live wallpapers"},
  {n:"Zooper Widget",c:"Launcher",d:"Data rich customizable widgets"},
];

const categories = ["All", ...new Set(apps.map(a => a.c))];
let activeCat = "All";
let searchTerm = "";

function initials(name) {
  return name.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
}
function colorFor(cat) {
  return palette[categories.indexOf(cat) % palette.length];
}

function renderChips() {
  const chipsEl = document.getElementById("chips");
  chipsEl.innerHTML = "";
  categories.forEach(cat => {
    const chip = document.createElement("div");
    chip.className = "chip" + (cat === activeCat ? " active" : "");
    chip.textContent = cat;
    chip.onclick = () => { activeCat = cat; renderChips(); renderApps(); };
    chipsEl.appendChild(chip);
  });
}

function renderApps() {
  const grid = document.getElementById("appGrid");
  const filtered = apps.filter(a => {
    const matchCat = activeCat === "All" || a.c === activeCat;
    const matchSearch = a.n.toLowerCase().includes(searchTerm.toLowerCase()) ||
                         a.d.toLowerCase().includes(searchTerm.toLowerCase());
    return matchCat && matchSearch;
  });
  document.getElementById("count").textContent = filtered.length;
  grid.innerHTML = filtered.length ? "" : '<div class="empty">No apps found</div>';
  filtered.forEach(a => {
    const card = document.createElement("div");
    card.className = "app-card";
    card.innerHTML = `
      <div class="app-icon" style="background:${colorFor(a.c)}">${initials(a.n)}</div>
      <div class="app-info">
        <div class="cat">${a.c}</div>
        <div class="name">${a.n}</div>
        <div class="desc">${a.d}</div>
      </div>`;
    grid.appendChild(card);
  });
}

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  renderApps();
});

document.getElementById("themeToggle").addEventListener("click", () => {
  const html = document.documentElement;
  const isDark = html.getAttribute("data-theme") === "dark";
  html.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("themeToggle").textContent = isDark ? "🌙" : "☀️";
});

function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  document.getElementById("date").textContent =
    now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
}
setInterval(updateClock, 1000);
updateClock();

renderChips();
renderApps();
</script>
</body>
</html>
